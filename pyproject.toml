[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "network-port-scanner"
version = "2.0.0"
description = "An async, multi-host TCP port scanner for authorized security testing."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "23rob" }
]
keywords = ["cybersecurity", "networking", "port-scanner", "security-tools", "asyncio"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: System :: Networking",
]

# Zero runtime dependencies on purpose: everything is Python's
# standard library (asyncio, ssl, ipaddress, argparse). Fewer
# dependencies means a smaller supply-chain surface for a security
# tool, and a trivial `pip install` with nothing else to resolve.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "pytest-cov>=5.0", "ruff>=0.4"]

[project.urls]
Repository = "https://github.com/23rob/network-port-scanner"

[project.scripts]
portscan = "port_scanner.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
